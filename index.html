<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const infoPanel = $('info-panel'), panelTitle = $('panel-title'), panelBody = $('panel-body'), closeBtn = $('close-panel');
const toggleCtrl = $('toggle-ctrl'), ctrlPanel = $('ctrl-panel');
const timeSlider = $('time-speed'), timeDisplay = $('time-display'), timeInput = $('time-input');
const btnPause = $('btn-pause'), btnPlay = $('btn-play');
const tooltip = $('tooltip');
const dateText = $('date-text'), angleText = $('angle-text');
const loadingOverlay = $('loading-overlay'), loaderBar = $('loader-bar'), loaderSub = $('loader-sub');
const fpHud = $('fp-hud'), fpHudPlanet = $('fp-hud-planet'), fpExitBtn = $('fp-exit-btn');
const resetView = $('reset-view'), resetRadius = $('reset-radius');
const radiusSliders = $('radius-sliders');
const mobileTip = $('mobileTip'), closeTipBtn = $('closeTip');
if (mobileTip && closeTipBtn) { const u = () => mobileTip.style.display = window.innerWidth < 768 ? 'flex' : 'none'; u(); closeTipBtn.onclick = () => mobileTip.style.display = 'none'; window.addEventListener('resize', u); }

// 场景
const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.5, 500);
camera.position.set(8, 6, 14);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.target.set(0, 0, 0);
controls.minDistance = 3; controls.maxDistance = 120; controls.update();

// 光照
const ambientLight = new THREE.AmbientLight('#4466aa', 0.3); scene.add(ambientLight);
const hemiLight = new THREE.HemisphereLight('#88bbdd', '#224466', 0.4); scene.add(hemiLight);
const sunLight = new THREE.DirectionalLight('#ffeecc', 2.5);
sunLight.position.set(50, 30, 50); sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048; sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 10; sunLight.shadow.camera.far = 100;
sunLight.shadow.camera.left = -15; sunLight.shadow.camera.right = 15;
sunLight.shadow.camera.top = 15; sunLight.shadow.camera.bottom = -15;
scene.add(sunLight);
const backFill = new THREE.DirectionalLight('#554433', 0.3); backFill.position.set(-30, -10, -30); scene.add(backFill);

function createStars() {
    const n = 3000, p = new Float32Array(n * 3), c = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
        const t = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1), r = 100 + Math.random() * 200;
        p[i*3] = Math.sin(ph)*Math.cos(t)*r; p[i*3+1] = Math.sin(ph)*Math.sin(t)*r*0.6; p[i*3+2] = Math.cos(ph)*r;
        const cc = Math.random();
        if (cc < 0.6) { c[i*3]=.7+Math.random()*.3; c[i*3+1]=.7+Math.random()*.3; c[i*3+2]=.8+Math.random()*.2; }
        else if (cc < 0.8) { c[i*3]=.5+Math.random()*.4; c[i*3+1]=.6+Math.random()*.3; c[i*3+2]=.9+Math.random()*.1; }
        else { c[i*3]=.9+Math.random()*.1; c[i*3+1]=.5+Math.random()*.3; c[i*3+2]=.3+Math.random()*.3; }
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('color', new THREE.BufferAttribute(c, 3));
    return new THREE.Points(g, new THREE.PointsMaterial({ size: 0.15, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.8, sizeAttenuation: true }));
}
const stars = createStars(); scene.add(stars);

const texCache = new Map();
const texFiles = { '太阳': '2k_sun.jpg', '地球': '2k_earth_daymap.jpg', '月球': '2k_moon.jpg' };
let loaded = 0, total = Object.keys(texFiles).length;
function updL(p, m) { loaderBar.style.width = Math.min(p, 100) + '%'; if (m) loaderSub.textContent = m; }
async function loadTex(n) {
    const fn = texFiles[n]; if (!fn) return null; if (texCache.has(fn)) return texCache.get(fn);
    try { const t = await new Promise((res, rej) => new THREE.TextureLoader().load(fn, res, undefined, rej)); t.colorSpace = THREE.SRGBColorSpace; t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter; texCache.set(fn, t); loaded++; updL(loaded / total * 100, `加载纹理 ${loaded}/${total} - ${n}`); return t; }
    catch { loaded++; updL(loaded / total * 100, `加载纹理 ${loaded}/${total} - ${n}(备用)`); return null; }
}

// 太阳
const sun = new THREE.Mesh(new THREE.SphereGeometry(1.5, 48, 48), new THREE.MeshBasicMaterial({ color: '#fffef0' }));
sun.name = '太阳'; sun.userData = { name: '☀️ 太阳', type: 'G型主序星', diameter: '1,392,700 km', distance: '中心', temperature: '表面 5,500°C', moons: '—', desc: '太阳是太阳系的中心天体，地球绕其公转，形成四季更替。', color: '#ffb833' }; scene.add(sun);
loadTex('太阳').then(t => { if (t) { sun.material.map = t; sun.material.color.set('#ffffff'); sun.material.needsUpdate = true; } });

function mkGlow(c, s, o) {
    const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
    const ctx = cv.getContext('2d'), g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);

// 射线检测
const raycaster = new THREE.Raycaster(), mouseVec = new THREE.Vector2();
let mDown = new THREE.Vector2(), mUp = new THREE.Vector2(), isDragging = false;
function getHits(e) { mouseVec.x = e.clientX / innerWidth * 2 - 1; mouseVec.y = -(e.clientY / innerHeight) * 2 + 1; raycaster.setFromCamera(mouseVec, camera); return raycaster.intersectObjects(allClickables, true).filter(h => { let o = h.object; while (o) { if (o.userData?.isGlow) return false; o = o.parent; } return true; }); }
function topObj(h) { for (const x of h) { let o = x.object; while (o) { if (o.userData?.name && !o.userData?.isGlow) return o; o = o.parent; } } return null; }

renderer.domElement.addEventListener('pointerdown', e => { mDown.set(e.clientX, e.clientY); isDragging = false; });
renderer.domElement.addEventListener('pointermove', e => { if (mDown.distanceTo(new THREE.Vector2(e.clientX, e.clientY)) > 3) isDragging = true; const h = topObj(getHits(e)); if (h && h.userData.name && !h.userData.isSeason) { tooltip.textContent = h.userData.name; tooltip.style.left = e.clientX + 12 + 'px'; tooltip.style.top = e.clientY - 10 + 'px'; tooltip.classList.add('show'); } else tooltip.classList.remove('show'); });
renderer.domElement.addEventListener('pointerup', e => { mUp.set(e.clientX, e.clientY); if (!isDragging && mDown.distanceTo(mUp) < 4) { const h = topObj(getHits(e)); if (h) showInfoPanel(h.userData); } isDragging = false; });
renderer.domElement.addEventListener('touchstart', e => { if (e.touches.length === 1) { mDown.set(e.touches[0].clientX, e.touches[0].clientY); isDragging = false; } }, { passive: false });
renderer.domElement.addEventListener('touchend', e => { if (!isDragging && e.changedTouches.length === 1) { const t = e.changedTouches[0]; if (mDown.distanceTo(new THREE.Vector2(t.clientX, t.clientY)) < 8) { const h = topObj(getHits({ clientX: t.clientX, clientY: t.clientY })); if (h) showInfoPanel(h.userData); } } });
closeBtn.addEventListener('click', () => infoPanel.classList.remove('visible'));

// 第一视角
let isFP = false, fpTarget = null, fpSP = null, fpST = null;
function enterFP(obj) { if (isFP) return; fpTarget = obj; fpSP = camera.position.clone(); fpST = controls.target.clone(); isFP = true; controls.enabled = false; fpHudPlanet.textContent = obj.userData.name.replace(/[🛰️🇨🇳🌙☀️🌍]/g, '').trim(); fpHud.classList.add('show'); infoPanel.classList.remove('visible'); document.body.classList.add('fp-mode'); const p = obj.position.clone(); let sz = 0.5; if (obj.geometry?.parameters?.radius) sz = obj.geometry.parameters.radius; if (sz < 0.05) sz = 0.5; const o = new THREE.Vector3(sz * 4 + 1, sz * 2, sz * 4 + 1); camera.position.copy(p.clone().add(o)); controls.target.copy(p); controls.update(); setTimeout(() => { controls.enabled = true; controls.minDistance = Math.max(0.3, sz * 0.5); controls.maxDistance = sz * 10 + 3; }, 300); }
function exitFP() { if (!isFP) return; isFP = false; fpTarget = null; fpHud.classList.remove('show'); document.body.classList.remove('fp-mode'); controls.enabled = true; controls.minDistance = 3; controls.maxDistance = 120; if (fpSP) { camera.position.copy(fpSP); controls.target.copy(fpST); controls.update(); } }
fpExitBtn?.addEventListener('click', () => { exitFP(); infoPanel.classList.remove('visible'); });

function showInfoPanel(data) {
    let icon = '🪐'; if (data.isSatellite) icon = '🛰️'; if (data.name?.includes('太阳')) icon = '☀️'; if (data.name?.includes('月球')) icon = '🌙'; if (data.isSeason) icon = '🌸';
    panelTitle.textContent = `${icon} ${data.name.replace(/[🛰️🇨🇳🌙☀️🌍🌸]/g, '').trim()}`;
    let fpH = '';
    if (data.isFP && !data.isSeason) { const a = isFP && fpTarget && fpTarget.userData.name === data.name; fpH = `<button id="fp-btn" style="width:100%;padding:10px 0;border:1px solid ${a ? 'rgba(255,80,80,0.3)' : 'rgba(100,180,255,0.25)'};background:${a ? 'rgba(255,60,60,0.15)' : 'rgba(60,120,255,0.1)'};color:${a ? '#ff8877' : '#88ccff'};border-radius:10px;font-size:.8rem;cursor:pointer;pointer-events:auto;margin-top:4px;">${a ? '🛸 退出第一视角' : '🚀 第一视角'}</button>`; }
    panelBody.innerHTML = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;"><div class="obj-icon" style="background:${data.color};width:30px;height:30px;"></div><span style="font-size:.8rem;color:#bcc8dd;">${data.type || ''}</span></div><div class="info-row"><span class="label">直径</span><span class="value">${data.diameter || '—'}</span></div><div class="info-row"><span class="label">距离</span><span class="value">${data.distance || '—'}</span></div>${data.temperature && data.temperature !== '—' ? `<div class="info-row"><span class="label">温度</span><span class="value">${data.temperature}</span></div>` : ''}${data.moons && data.moons !== '—' ? `<div class="info-row"><span class="label">卫星</span><span class="value">${data.moons}</span></div>` : ''}<div class="info-desc">${data.desc || ''}</div>${fpH}`;

}

// === 对数速度控制 (0.01 ~ 9999) ===
let tS = 1, iP = false, vT = 0;

function sliderToSpeed(val) { return Math.pow(10, val / 25 - 2); }
function speedToSlider(speed) { if (speed <= 0) return 0; const v = (Math.log10(speed) + 2) * 25; return Math.max(0, Math.min(100, v)); }
function updateDisplay(speed) { if (speed < 0.01) speed = 0.01; if (speed > 9999) speed = 9999; timeDisplay.textContent = speed.toFixed(2) + '×'; timeInput.value = speed.toFixed(2); }

timeSlider.oninput = () => { const speed = sliderToSpeed(parseFloat(timeSlider.value)); tS = speed; updateDisplay(speed); if (iP && speed > 0) { iP = false; updateBtn(); } updateBtn(); };

// 修复：输入框允许自由输入，失焦时才校验
timeInput.addEventListener('focus', () => {});
timeInput.addEventListener('blur', () => {
    let v = parseFloat(timeInput.value);
    if (isNaN(v) || v < 0.01) { v = 0.01; timeInput.value = '0.01'; tS = 0.01; timeSlider.value = speedToSlider(0.01); timeDisplay.textContent = '0.01×'; }
    else if (v > 9999) { v = 9999; timeInput.value = '9999'; tS = 9999; timeSlider.value = 100; timeDisplay.textContent = '9999.00×'; }
    else { tS = v; timeSlider.value = speedToSlider(v); timeDisplay.textContent = v.toFixed(2) + '×'; }
    if (iP && tS > 0) { iP = false; updateBtn(); } updateBtn();
});
timeInput.addEventListener('input', () => {
    const val = timeInput.value;
    if (val === '' || val === '-' || val === '.') return;
    let v = parseFloat(val);
    if (isNaN(v) || v < 0.01) v = 0.01;
    if (v > 9999) v = 9999;
    tS = v; timeSlider.value = speedToSlider(v); timeDisplay.textContent = v.toFixed(2) + '×';
    if (iP && v > 0) { iP = false; updateBtn(); } updateBtn();
});

function updateBtn() { btnPause.classList.toggle('act', iP); btnPlay.classList.toggle('act', !iP); }
btnPause.onclick = () => { iP = true; timeSlider.value = 0; tS = 0; timeInput.value = '0'; timeDisplay.textContent = '0.00×'; updateBtn(); };

// 半径滑块
function buildRadiusSliders() {
    radiusSliders.innerHTML = '';
    const items = ['太阳', '地球'], colors = ['#ffcc33', '#5599dd'];
    items.forEach((name, i) => {
        const row = document.createElement('div'); row.className = 'sr';
        const dot = document.createElement('span'); dot.style.cssText = `width:8px;height:8px;border-radius:50%;background:${colors[i]};display:inline-block;flex-shrink:0;`;
        const lb = document.createElement('span'); lb.className = 'sl'; lb.textContent = name;
        const inp = document.createElement('input'); inp.type = 'range'; inp.min = 0.1; inp.max = 10.0; inp.step = 0.1; inp.value = 1.0;
        const vl = document.createElement('span'); vl.className = 'sv'; vl.textContent = '1.0';
        inp.oninput = () => { const v = parseFloat(inp.value); vl.textContent = v.toFixed(1); scaleFactors[name] = v;
            if (name === '太阳') { sun.scale.set(v, v, v); solarSystemGroup.scale.set(v, v, v); const r = 15 * v; sunLight.shadow.camera.left = -r; sunLight.shadow.camera.right = r; sunLight.shadow.camera.top = r; sunLight.shadow.camera.bottom = -r; sunLight.shadow.camera.updateProjectionMatrix(); }
            if (name === '地球') { earthTiltGroup.scale.set(v, v, v); } };

    scaleFactors['太阳'] = 1; sun.scale.set(1, 1, 1); solarSystemGroup.scale.set(1, 1, 1);

    scaleFactors['地球'] = 1; earthTiltGroup.scale.set(1, 1, 1);

function jumpToSeason(angleRad) {
    vT = angleRad / 0.3; earthGroup.position.x = Math.cos(angleRad) * BASE_ORBIT_R; earthGroup.position.z = Math.sin(angleRad) * BASE_ORBIT_R;
    const deg = ((angleRad * 180 / Math.PI) % 360 + 360) % 360; angleText.textContent = deg.toFixed(0) + '°'; dateText.textContent = getSeasonName(angleRad);
}
$('jump-spring').onclick = () => jumpToSeason(0); $('jump-summer').onclick = () => jumpToSeason(Math.PI / 2);
$('jump-autumn').onclick = () => jumpToSeason(Math.PI); $('jump-winter').onclick = () => jumpToSeason(3 * Math.PI / 2);

resetView.onclick = () => { camera.position.set(8, 6, 14); controls.target.set(0, 0, 0); controls.update(); exitFP(); };

let ctrlOpen = false; toggleCtrl.onclick = () => { ctrlOpen = !ctrlOpen; ctrlPanel.classList.toggle('open', ctrlOpen); };
document.addEventListener('pointerdown', e => { if (ctrlOpen && !ctrlPanel.contains(e.target) && e.target !== toggleCtrl) { ctrlOpen = false; ctrlPanel.classList.remove('open'); } });

function getSeasonName(angle) {
    const a = ((angle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI); const eps = 0.15;
    if (Math.abs(a - 0) < eps || Math.abs(a - 2 * Math.PI) < eps) return '🌸 春分';
    if (Math.abs(a - Math.PI / 2) < eps) return '☀️ 夏至'; if (Math.abs(a - Math.PI) < eps) return '🍂 秋分';
    if (Math.abs(a - 3 * Math.PI / 2) < eps) return '❄️ 冬至';
    if (a > 0 && a < Math.PI / 2) return '春分→夏至'; if (a > Math.PI / 2 && a < Math.PI) return '夏至→秋分';
    if (a > Math.PI && a < 3 * Math.PI / 2) return '秋分→冬至'; return '冬至→春分';
}

const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.15), edt = iP ? 0 : dt * tS;
    if (!iP) vT += edt;
    const angle = vT * 0.3;
    earthGroup.position.x = Math.cos(angle) * BASE_ORBIT_R; earthGroup.position.z = Math.sin(angle) * BASE_ORBIT_R;
    earth.rotation.y += edt * 0.5;
    const mA = vT * 2.0; moon.position.x = Math.cos(mA) * 1.2; moon.position.z = Math.sin(mA) * 1.2; moon.rotation.y += edt * 0.8;
    const iA = vT * 8.0; iss.position.x = Math.cos(iA) * 1.6; iss.position.z = Math.sin(iA) * 1.6; iss.position.y = Math.sin(iA * 2) * 0.15;
    const tA = vT * 6.0 + 1.2; tiangong.position.x = Math.cos(tA) * 1.4; tiangong.position.z = Math.sin(tA) * 1.4; tiangong.position.y = Math.sin(tA * 2 + 0.5) * 0.12;
    sun.rotation.y += edt * 0.1;
    const earthPos = new THREE.Vector3(); earthGroup.getWorldPosition(earthPos);
    const ld = earthPos.clone().normalize(); sunLight.position.copy(ld.clone().multiplyScalar(-50));
    sunLight.target.position.copy(earthPos); scene.add(sunLight.target); sunLight.target.updateMatrixWorld();
    rayLine.geometry.dispose(); rayLine.geometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(Math.cos(angle) * BASE_ORBIT_R * 0.8, 0, Math.sin(angle) * BASE_ORBIT_R * 0.8)]);
    const deg = ((angle * 180 / Math.PI) % 360 + 360) % 360; angleText.textContent = deg.toFixed(0) + '°'; dateText.textContent = getSeasonName(angle);
    if (isFP && fpTarget) { const tp = new THREE.Vector3(); if (fpTarget.parent === earthTiltGroup || fpTarget.parent === moonOrbit || fpTarget.parent === issGroup || fpTarget.parent === tgGroup) { fpTarget.getWorldPosition(tp); } else { tp.copy(fpTarget.position); } controls.target.lerp(tp, 0.05); }
    controls.update(); stars.rotation.y += edt * 0.003; renderer.render(scene, camera);
}
animate();

window.onresize = () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); };
window.addEventListener('keydown', e => { if (e.key === ' ' && !e.target.matches('input')) { e.preventDefault(); iP ? btnPlay.click() : btnPause.click(); } if (e.key === 'Escape' && isFP) { exitFP(); infoPanel.classList.remove('visible'); } });

console.log('🌍 地球版·输入框修复 已启动');
